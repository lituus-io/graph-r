[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# The distribution is `uu-graph-r`, matching its sibling `uu-link-r` (whose
# unprefixed name PyPI's similarity rule blocks outright). Only the
# `pip install` name carries the prefix; the module this wheel ships is still
# `graph_r`.
name = "uu-graph-r"
version = "0.1.0"
description = "Embedded persistent knowledge graph: absorb a crawl, keep it fresh on an adaptive TTL, answer with URLs and anchors inside a token budget."
# abi3-py312 is the floor the Rust side builds against; a lower declaration
# here would promise interpreters the wheel cannot actually load.
requires-python = ">=3.12"
readme = "README.md"
# A PEP 639 SPDX expression (PyPI rejects the legacy free-text License field
# at Metadata-Version 2.4, and rejects License classifiers beside an
# expression). LicenseRef-Proprietary is one of the two custom refs PEP 639
# permits, and names the commercial option — terms and contact are in the
# README and LICENSE.
license = "AGPL-3.0-or-later OR LicenseRef-Proprietary"
authors = [{ name = "lituus-io", email = "spicyzhug@gmail.com" }]
keywords = ["knowledge-graph", "embedded", "crawler", "index", "ttl"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "graph_r"
# Type stub shipped alongside the compiled module.
include = ["graph_r.pyi"]
# The wheel builds against the stable ABI: one cp312-abi3 artifact per
# platform loads on 3.12 and every later version.
