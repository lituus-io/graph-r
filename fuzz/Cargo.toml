[package]
name = "graph-r-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.7"
graph-r = { package = "uu-graph-r", path = "..", default-features = false, features = ["store"] }

[[bin]]
name = "fuzz_base_parse"
path = "fuzz_targets/fuzz_base_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wal_replay"
path = "fuzz_targets/fuzz_wal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_op_decode"
path = "fuzz_targets/fuzz_op_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_postings_decode"
path = "fuzz_targets/fuzz_postings_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wal_committed_len"
path = "fuzz_targets/fuzz_wal_committed_len.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_open_image"
path = "fuzz_targets/fuzz_open_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_two_writers"
path = "fuzz_targets/fuzz_two_writers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_record_decode"
path = "fuzz_targets/fuzz_record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_crash_cut"
path = "fuzz_targets/fuzz_crash_cut.rs"
test = false
doc = false
bench = false

# Detached from the parent workspace on purpose (mirrors link-r's layout).
[workspace]
members = ["."]
