[package]
name = "uu-graph-r"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Embedded, persistent knowledge graph and the shared core of the lituus-io stack: TTL-driven freshness, lineage walks, zero-copy mmap snapshots, token-budgeted local lookups"
repository = "https://github.com/lituus-io/graph-r"
authors = ["lituus-io <support@lituus.io>"]
homepage = "https://github.com/lituus-io/graph-r"
documentation = "https://docs.rs/uu-graph-r"
readme = "README.md"
exclude = ["/.github", "/scripts", "/bindings", "/fuzz"]
keywords = ["knowledge-graph", "embedded", "mmap", "ttl", "index"]
categories = ["database-implementations", "caching", "data-structures"]

[features]
# The default is the embedded graph store. Dependants that need only the core
# (xxh3 hashing, keys, byte codecs, the checksummed container, file
# primitives) set `default-features = false` and build xxhash-rust alone.
default = ["store"]
# Zero-copy read-only images: memory-mapped files, or bytes served in place.
mmap = ["dep:memmap2", "dep:bytes"]
# The embedded graph store: persistence, snapshots, lookups, TTL, ranking.
store = ["mmap", "dep:smallvec", "dep:compact_str"]

[lib]
name = "graph_r"

[package.metadata.docs.rs]
all-features = true

[dependencies]
# xxh3 is the single hash family: keys and container checksums.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = { version = "0.9", optional = true }
# Shared, reference-counted byte buffers: an image fetched from object
# storage is served in place, never copied.
bytes = { version = "1.7", optional = true }
smallvec = { version = "1.13", features = ["union", "const_generics"], optional = true }
compact_str = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.12"
futures = "0.3"

[[bench]]
name = "store_bench"
harness = false
required-features = ["store"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
lto = "fat"
debug = true

[workspace]
members = []
