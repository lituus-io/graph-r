[package]
name = "graph-r-mirror"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Sync a graph-r store directory with an object store (GCS, local, memory): byte-identical files, fenced single writer, incremental WAL shipping"
repository = "https://github.com/lituus-io/graph-r"
authors = ["lituus-io <spicyzhug@gmail.com>"]
publish = false

# A separate crate on purpose: graph-r's own manifest gains no dependency, so
# builds that never mirror are unaffected (cargo resolves every path
# dependency's manifest even when its feature is off).

[features]
default = []
# The Google Cloud Storage backend of objstore-r.
gcs = ["objstore-r/gcs"]

[dependencies]
graph-r = { path = "..", default-features = false }
objstore-r = { path = "../../objstore-r" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "1.0"
# try_join_all: fetch the base and every segment concurrently on the caller's
# task (no spawn).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
objstore-r = { path = "../../objstore-r", features = ["testing"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
proptest = "1.5"
tempfile = "3.12"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
criterion = "0.5"

[[bench]]
name = "mirror_bench"
harness = false

[profile.bench]
debug = true

[workspace]
members = ["."]
