# Copyright: lituus-io, all rights reserved
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the GitHub Release job is granted write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # A mistagged release ships a wheel whose metadata lies about its version;
  # refuse before building anything.
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - name: Tag must match every manifest
        run: |
          set -euo pipefail
          # On a tag, the tag is the authority; on a manual dispatch there is
          # no tag, so the root manifest is — either way all three must agree.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi
          for f in Cargo.toml bindings/python/Cargo.toml bindings/python/pyproject.toml; do
            grep -q "^version = \"$tag\"" "$f" \
              || { echo "::error::$f does not declare version $tag"; exit 1; }
          done

  # One abi3 wheel per platform: the binding builds against the stable ABI
  # (abi3-py312), so a single artifact serves Python 3.12 and everything later.
  build-wheel:
    name: Wheel (${{ matrix.name }})
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds go through zig so the wheel links against
          # manylinux_2_28 glibc rather than the runner's (too-new) one.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin, args: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, args: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, args: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      # rustup show installs the toolchain rust-toolchain.toml pins; the
      # target is then added to that same toolchain.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
          key: wheel-${{ matrix.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin (and zig for manylinux)
        shell: bash
        run: pip install maturin ziglang
      - name: Build wheel
        shell: bash
        working-directory: bindings/python
        run: maturin build --release --target ${{ matrix.target }} ${{ matrix.args }} --out dist
      - name: Smoke the wheel (host-native builds only)
        # Cross targets cannot import on this runner; the abi3 tag and
        # metadata were already validated by maturin itself.
        if: matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: bindings/python
        run: |
          python -m venv .smoke
          . .smoke/bin/activate 2>/dev/null || . .smoke/Scripts/activate
          pip install dist/*.whl pytest
          pytest tests/ -q
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  # One source distribution: maturin bundles the binding with the sibling
  # crates it path-depends on, so `pip install` can build where no wheel fits.
  build-sdist:
    name: Source distribution
    needs: version-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: bindings/python/dist/*.tar.gz

  release:
    name: GitHub Release
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # crates.io, with this crate's own scoped token. docs.rs builds the
  # documentation from the published crate ([package.metadata.docs.rs]).
  # A dependency released minutes earlier from a sibling repository may not
  # be in the index yet, so publishing retries for up to 20 minutes.
  publish-crate:
    name: Publish to crates.io
    needs: version-gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned sibling repositories
        shell: bash
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
        run: scripts/fetch-siblings.sh
      - run: rustup show
      - name: Publish uu-graph-r
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN_UU_GRAPH_R }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if curl -sf -A "lituus-io-release" "https://crates.io/api/v1/crates/uu-graph-r/$version" >/dev/null; then
            echo "uu-graph-r $version is already on crates.io"
            exit 0
          fi
          for attempt in $(seq 1 20); do
            cargo publish && exit 0
            echo "attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1

  # PyPI Trusted Publishing: PyPI trusts this workflow file (release.yaml)
  # in this repository, running in the `pypi` environment, and exchanges the
  # job's OIDC token for a short-lived upload token. No secret is stored.
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uu-graph-r/
    permissions:
      id-token: write # OIDC token for trusted publishing; nothing else
    # Tag-gated for real releases; also runnable by hand so a publish-side
    # failure can be retried without minting a new tag (the wheels are rebuilt
    # from the same commit either way).
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download wheels and the sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true
