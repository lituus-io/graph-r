name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

# Two things shape this file.
#
# 1. The toolchain is NOT selected by dtolnay/rust-toolchain. That action exports
#    RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml, so CI would silently
#    test a different compiler than developers run -- the exact failure the dated
#    pin exists to prevent. `rustup show` installs the toolchain the file names.
#
# 2. `bridge` is an optional feature backed by a relative path dependency
#    (link-r = { path = "../link-r" }). Cargo reads a path dependency's manifest
#    while resolving metadata **whether or not the feature is enabled**, so
#    without the sibling present *every* cargo invocation fails -- including
#    `cargo fmt` and `--no-default-features`. The sibling is therefore fetched in
#    every job, not just the ones that exercise the bridge.
#
#    actions/checkout cannot write outside $GITHUB_WORKSPACE, and `../link-r`
#    resolves above it, so the sibling is cloned with git directly.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets

  test:
    name: Test (${{ matrix.name }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          # Windows is the only place the non-flock LockFile fallback runs; its
          # release-on-drop path is unverifiable on any unix host.
          - { name: windows-x86_64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        shell: bash
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Test
        shell: bash
        run: cargo test --all-features

  features:
    name: Feature matrix
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # `default = []` is the product promise: the pure embedded store pulls in
      # no optional dependency. Each feature must also stand alone, or "install
      # by requirement" is only true for the combinations someone happened to try.
      - name: Each feature combination
        run: |
          set -euo pipefail
          for f in "" "bridge" "llm" "bridge,llm"; do
            echo "::group::features=${f:-none}"
            if [ -z "$f" ]; then
              cargo check --no-default-features --all-targets
            else
              cargo check --no-default-features --features "$f" --all-targets
            fi
            echo "::endgroup::"
          done

  docs:
    name: Docs
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The crate is #![deny(missing_docs)]; this additionally catches broken
      # intra-doc links, which compile fine but rot silently.
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python:
    name: Python bindings
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
          key: pyo3
      - uses: actions/setup-python@v5
        with:
          # 3.12 is the abi3 floor the binding builds against; the resulting
          # wheel loads on every later version from the same artifact.
          python-version: "3.12"
      - name: Fmt and clippy the binding
        working-directory: bindings/python
        run: |
          cargo fmt --check
          cargo clippy --all-targets
      - name: Build and test the wheel in place
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop --release
          pytest tests/ -v

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Reported, not gated. Publishing the number first means the floor that
      # follows is a measurement rather than a guess.
      - name: Measure
        run: |
          cargo llvm-cov --all-features --summary-only | tee coverage.txt
          {
            echo "### Coverage"
            echo ""
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
