name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; only the GitHub Release job is granted write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # A mistagged release ships a wheel whose metadata lies about its version;
  # refuse before building anything.
  version-gate:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match every manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for f in Cargo.toml bindings/python/Cargo.toml bindings/python/pyproject.toml; do
            grep -q "^version = \"$tag\"" "$f" \
              || { echo "::error::$f does not declare version $tag"; exit 1; }
          done

  # One abi3 wheel per platform: the binding builds against the stable ABI
  # (abi3-py312), so a single artifact serves Python 3.12 and everything later.
  build-wheel:
    name: Wheel (${{ matrix.name }})
    needs: version-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds go through zig so the wheel links against
          # manylinux_2_28 glibc rather than the runner's (too-new) one.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, args: "--zig --compatibility manylinux_2_28" }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin, args: "" }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, args: "" }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, args: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the link-r sibling
        shell: bash
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SIBLING_REPO_TOKEN || github.token }}@github.com/lituus-io/link-r.git" \
            "$GITHUB_WORKSPACE/../link-r"
      # rustup show installs the toolchain rust-toolchain.toml pins; the
      # target is then added to that same toolchain.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
          key: wheel-${{ matrix.name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin (and zig for manylinux)
        shell: bash
        run: pip install maturin ziglang
      - name: Build wheel
        shell: bash
        working-directory: bindings/python
        run: maturin build --release --target ${{ matrix.target }} ${{ matrix.args }} --out dist
      - name: Smoke the wheel (host-native builds only)
        # Cross targets cannot import on this runner; the abi3 tag and
        # metadata were already validated by maturin itself.
        if: matrix.name != 'macos-x86_64'
        shell: bash
        working-directory: bindings/python
        run: |
          python -m venv .smoke
          . .smoke/bin/activate 2>/dev/null || . .smoke/Scripts/activate
          pip install dist/*.whl pytest
          pytest tests/ -q
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  release:
    name: GitHub Release
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload assets
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    # Tag-gated for real releases; also runnable by hand so a publish-side
    # failure can be retried without minting a new tag (the wheels are rebuilt
    # from the same commit either way).
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PACKAGE }}
        run: |
          pip install twine
          twine check dist/*
          twine upload --verbose --skip-existing dist/*
