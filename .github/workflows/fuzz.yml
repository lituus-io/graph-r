name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 3' # Weekly, Wednesday 03:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        default: '60'
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ inputs.duration || '60' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One target per decoder that reads bytes this crate did not write.
        # The invariant is uniform: any input yields a typed error, never a
        # panic and never an over-allocation.
        target:
          - fuzz_base_parse
          - fuzz_wal_replay
          - fuzz_op_decode
          - fuzz_postings_decode
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml already pins a nightly, which is what cargo-fuzz
      # needs to build the instrumented target.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      # cargo-fuzz is tooling, not part of the build: a current stable compiler
      # builds it, matching how cargo-audit is installed in security.yml.
      - name: Install cargo-fuzz
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-fuzz --locked

      - name: Run fuzzer
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_DURATION }}

      # A crash artifact is the whole point of the run: keep it, because the
      # corpus itself is not tracked (findings are promoted into
      # tests/regression.rs instead, so they replay on every ordinary test run).
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
